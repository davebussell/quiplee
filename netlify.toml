# Netlify builds the plays site from the cached prices in data/prices/ on every
# push (the nightly price refresh is a push), then publishes _site/, unless the build
# has moved to GitHub Actions (see `ignore` below and .github/workflows/deploy.yml). The live
# desk's serverless functions deploy from netlify/functions as before.
[build]
  command = "python -m pip install -q -r requirements.txt && python tools/build_strategies.py --out _site"
  publish = "_site"
  # Once GitHub Actions builds and deploys the site (.github/workflows/deploy.yml), an empty
  # .deploy-from-actions file in the repo makes Netlify skip its own builds. Without it,
  # Netlify builds every push as before.
  ignore = "test -f .deploy-from-actions"

[build.environment]
  NODE_VERSION = "20"       # ensures global fetch() is available in functions
  PYTHON_VERSION = "3.12"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# The site moved from quiplee.com to bethepuck.com in October 2026. Every old
# address forwards to the same page on the new domain. (The member gate edge
# function does the same for /picks/ and /articles/, since an edge function's
# response takes the place of these rules on its paths.)
[[redirects]]
  from = "https://quiplee.com/*"
  to = "https://bethepuck.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.quiplee.com/*"
  to = "https://bethepuck.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://quiplee.com/*"
  to = "https://bethepuck.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.quiplee.com/*"
  to = "https://bethepuck.com/:splat"
  status = 301
  force = true

# Stock x play pages now exist only for each stock's headline plays (the most accurate play per
# family and render.HEADLINE_EXTRA) and for every play on SPY (render.EXTRA_PAIRS). Any other
# one forwards to that play's row on the stock page; the pages that still exist are files, so
# this rule never covers them.
[[redirects]]
  from = "/stocks/:sym/:play/"
  to = "/stocks/:sym/?play=:play"
  status = 301

# Lessons that were renamed when the site grew from 7 rules to 59 plays
[[redirects]]
  from = "/learn/the-seven-rules/*"
  to = "/learn/the-play-families/"
  status = 301

# Stories now live alongside every other piece under /articles/ (the Hertz
# lesson keeps its URL at /stories/the-hertz-lesson.html)
# Paper trading was replaced by the Theory tester (October 2026). Player data stays in Blobs.
[[redirects]]
  from = "/paper"
  to = "/theory/"
  status = 301

[[redirects]]
  from = "/paper/*"
  to = "/theory/"
  status = 301

[[redirects]]
  from = "/stories"
  to = "/articles/"
  status = 301

[[redirects]]
  from = "/stories/"
  to = "/articles/"
  status = 301

# The locked versions of members-only pages are served by the member gate at
# the real URLs; keep the copies under /locked/ out of search results
[[headers]]
  for = "/locked/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# The automation guide's downloads (assets/downloads/): readable in the browser, saved by the download links
[[headers]]
  for = "/assets/downloads/*"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    X-Content-Type-Options = "nosniff"

# Rebuilds the strategy pages (home, /strategies, /thinkers, /stocks, /method,
# data/signals.json, sitemap.xml) from fresh prices after each U.S. close and
# commits the result. Runs daily so crypto updates on weekends too.
#
# If quiplee.com deploys from this repo on Netlify, the commit publishes it.
# If it deploys by CLI instead, add NETLIFY_AUTH_TOKEN and NETLIFY_SITE_ID as
# repository secrets and the last step deploys directly.
name: Refresh strategy pages

on:
  schedule:
    - cron: "40 21 * * *"   # 17:40 ET in summer, 16:40 ET in winter
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-strategies
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install "yfinance>=0.2.50" pandas numpy
      - name: Build strategy pages
        run: python tools/build_strategies.py
      - name: Commit refreshed pages
        run: |
          git config user.name "quiplee-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html strategies thinkers stocks method data sitemap.xml
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Strategy refresh $(date -u +%F)"
            git push
          fi
      - name: Deploy to Netlify (only when secrets are set)
        if: env.NETLIFY_AUTH_TOKEN != '' && env.NETLIFY_SITE_ID != ''
        run: npx --yes netlify-cli@17 deploy --prod --dir . --functions netlify/functions --message "Strategy refresh"

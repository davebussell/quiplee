# Refreshes the price cache (data/prices/*.csv) after each U.S. close and
# commits it. The commit is a push to main, so Netlify rebuilds the whole site
# from the new prices (see netlify.toml). Runs daily so crypto updates on
# weekends too. If Yahoo fails for a ticker, its old file is kept.
name: Refresh prices

on:
  schedule:
    - cron: "45 21 * * *"   # 17:45 ET in summer, 16:45 ET in winter
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-prices
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install "yfinance>=0.2.50" -r requirements.txt
      - name: Fetch prices
        run: python tools/fetch_prices.py
      - name: Commit the new prices
        run: |
          git config user.name "quiplee-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices
          if git diff --cached --quiet; then
            echo "No price changes"
          else
            git commit -m "Prices $(date -u +%F)"
            git push
          fi

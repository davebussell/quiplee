# After each U.S. close (and a morning top-up for crypto): adds the stocks readers asked for on /watchlist/,
# refreshes prices, macro series (FRED, multpl) and company fundamentals in
# data/, and commits them. The commit is a push to main, so Netlify rebuilds
# the whole site from the new data (see netlify.toml). Runs every day so crypto
# and reader requests update on weekends too. If a source fails, the old file
# is kept and the macro and fundamentals steps never block the price refresh.
name: Refresh prices

on:
  schedule:
    - cron: "45 21 * * *"   # 17:45 ET in summer, 16:45 ET in winter
    - cron: "15 10 * * *"   # morning top-up: Yahoo often posts the previous UTC day's crypto bar late
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-prices
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install "yfinance>=0.2.50" -r requirements.txt
      - name: Add readers' requested stocks
        run: python tools/sync_requests.py || echo "request sync skipped"
      - name: Fetch prices
        run: python tools/fetch_prices.py
      - name: Fetch macro series
        run: python tools/fetch_macro.py || true
      - name: Fetch company fundamentals
        if: github.event.schedule != '15 10 * * *'
        run: python tools/fetch_fundamentals.py || true
      - name: Commit the new prices
        run: |
          git config user.name "bethepuck-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices data/macro data/fundamentals data/universe
          if git diff --cached --quiet; then
            echo "No price changes"
          else
            git commit -m "Prices $(date -u +%F)"
            git push
          fi
